name: Update sitemap

on:
  push:
    branches: [master]
    paths-ignore:
      - sitemap.xml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sitemap-master
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate sitemap from canonical URLs
        run: python3 scripts/generate_sitemap.py
      - name: Commit sitemap when it changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update sitemap"
          git push
