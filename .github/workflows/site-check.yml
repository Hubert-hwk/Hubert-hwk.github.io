name: Site integrity

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate sitemap from canonical URLs
        run: python3 scripts/generate_sitemap.py
      - name: Check generated site
        run: python3 scripts/check_site.py
