<!DOCTYPE html>
<html lang="zh-hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>页面不存在 | Hubert Blog</title>
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/dist/main.css" />
  <link rel="stylesheet" href="/css/fonts/remixicon.css" />
  <link rel="stylesheet" href="/css/custom.css" />
</head>
<body>
  <div id="app">
    <main class="content on">
      <section class="outer">
        <div class="notfound-card">
          <p class="notfound-card__code">404</p>
          <h1 class="notfound-card__title">这个页面走丢了</h1>
          <p class="notfound-card__desc">你访问的路径不存在，可能已经被移动或删除。</p>
          <a class="notfound-card__btn" href="/"><i class="ri-arrow-left-line"></i> 返回首页</a>
        </div>
      </section>
      <footer class="footer">
        <div class="outer"><ul><li>Copyrights &copy; 2024-2026 <i class="ri-heart-fill heart_icon"></i> Hwk</li></ul></div>
      </footer>
    </main>
    <aside class="sidebar on">
      <button class="navbar-toggle"></button>
      <nav class="navbar">
        <div class="logo"><a href="/"><img src="/images/ayer-side.svg" alt="Hubert Blog"></a></div>
        <ul class="nav nav-main">
          <li class="nav-item"><a class="nav-item-link" href="/">首页</a></li>
          <li class="nav-item"><a class="nav-item-link" href="/archives">归档</a></li>
          <li class="nav-item"><a class="nav-item-link" href="/about/hwk.html">关于我</a></li>
          <li class="nav-item"><a class="nav-item-link" href="https://github.com/Hubert-hwk" target="_blank" rel="noopener">GitHub</a></li>
        </ul>
        <ul class="nav nav-main" style="margin-top:1.6rem;border-top:1px solid #eef1f6;padding-top:1rem">
          <li class="nav-item"><span class="post-dark" id="postDark" title="切换深浅色模式"><i class="ri-moon-line"></i></span></li>
        </ul>
      </nav>
    </aside>
  </div>
  <script src="/js/particles.js"></script>
  <script src="/js/view-counter.js" defer></script>
  <script>
    (function () {
      var toggle = document.querySelector('.navbar-toggle');
      if (toggle) {
        toggle.addEventListener('click', function () {
          document.querySelector('.content').classList.toggle('on');
          document.querySelector('.sidebar').classList.toggle('on');
        });
      }
      var darkBtn = document.getElementById('postDark');
      var applyDark = function (on) {
        document.body.classList.toggle('darkmode', on);
        var i = darkBtn.querySelector('i');
        i.classList.toggle('ri-moon-line', !on);
        i.classList.toggle('ri-sun-line', on);
      };
      if (darkBtn) {
        darkBtn.addEventListener('click', function () {
          var on = !document.body.classList.contains('darkmode');
          applyDark(on);
          if (on) { sessionStorage.setItem('darkmode', 1); } else { sessionStorage.removeItem('darkmode'); }
        });
        applyDark(sessionStorage.getItem('darkmode') === '1');
      }
    })();
  </script>
</body>
</html>
