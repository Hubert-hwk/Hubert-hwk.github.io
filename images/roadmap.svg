<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 时间轴 -->
  <line x1="40" y1="70" x2="820" y2="70" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Phase 1 -->
  <g>
    <circle cx="115" cy="70" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <line x1="115" y1="79" x2="115" y2="104" stroke="#2563eb" stroke-width="2"/>
    <rect x="20" y="106" width="190" height="196" rx="14" fill="#ffffff" stroke="#c7d8f5" stroke-width="1.5"/>
    <text x="115" y="138" text-anchor="middle" fill="#2563eb" font-size="12.5" font-weight="700">PHASE 1</text>
    <text x="115" y="162" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">最小闭环</text>
    <text x="115" y="190" text-anchor="middle" fill="#64748b" font-size="12">验证闭环是否成立</text>
    <text x="40" y="222" fill="#475569" font-size="12">周期：1–2 周</text>
    <text x="40" y="248" fill="#475569" font-size="12">人工占比</text>
    <rect x="40" y="258" width="140" height="8" rx="4" fill="#eef1f5"/>
    <rect x="40" y="258" width="112" height="8" rx="4" fill="#2563eb"/>
    <text x="185" y="267" text-anchor="end" fill="#2563eb" font-size="11.5" font-weight="700">80%</text>
    <text x="40" y="288" fill="#94a3b8" font-size="11.5">50–100 条评测 case</text>
  </g>

  <!-- Phase 2 -->
  <g>
    <circle cx="305" cy="70" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <line x1="305" y1="79" x2="305" y2="104" stroke="#2563eb" stroke-width="2"/>
    <rect x="210" y="106" width="190" height="196" rx="14" fill="#ffffff" stroke="#c7d8f5" stroke-width="1.5"/>
    <text x="305" y="138" text-anchor="middle" fill="#2563eb" font-size="12.5" font-weight="700">PHASE 2</text>
    <text x="305" y="162" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">半自动化</text>
    <text x="305" y="190" text-anchor="middle" fill="#64748b" font-size="12">自动改进且不退化</text>
    <text x="230" y="222" fill="#475569" font-size="12">周期：2–4 周</text>
    <text x="230" y="248" fill="#475569" font-size="12">人工占比</text>
    <rect x="230" y="258" width="140" height="8" rx="4" fill="#eef1f5"/>
    <rect x="230" y="258" width="56" height="8" rx="4" fill="#3b82f6"/>
    <text x="375" y="267" text-anchor="end" fill="#2563eb" font-size="11.5" font-weight="700">40%</text>
    <text x="230" y="288" fill="#94a3b8" font-size="11.5">Skill 管线 + CI 门禁</text>
  </g>

  <!-- Phase 3 -->
  <g>
    <circle cx="495" cy="70" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <line x1="495" y1="79" x2="495" y2="104" stroke="#2563eb" stroke-width="2"/>
    <rect x="400" y="106" width="190" height="196" rx="14" fill="#ffffff" stroke="#c7d8f5" stroke-width="1.5"/>
    <text x="495" y="138" text-anchor="middle" fill="#2563eb" font-size="12.5" font-weight="700">PHASE 3</text>
    <text x="495" y="162" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">飞轮运转</text>
    <text x="495" y="190" text-anchor="middle" fill="#64748b" font-size="12">飞轮能自主转动</text>
    <text x="420" y="222" fill="#475569" font-size="12">周期：1–2 月</text>
    <text x="420" y="248" fill="#475569" font-size="12">人工占比</text>
    <rect x="420" y="258" width="140" height="8" rx="4" fill="#eef1f5"/>
    <rect x="420" y="258" width="21" height="8" rx="4" fill="#3b82f6"/>
    <text x="565" y="267" text-anchor="end" fill="#2563eb" font-size="11.5" font-weight="700">15%</text>
    <text x="420" y="288" fill="#94a3b8" font-size="11.5">灰度 + 回流 + Dreaming</text>
  </g>

  <!-- Phase 4 -->
  <g>
    <circle cx="685" cy="70" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <line x1="685" y1="79" x2="685" y2="104" stroke="#2563eb" stroke-width="2"/>
    <rect x="590" y="106" width="190" height="196" rx="14" fill="#ffffff" stroke="#c7d8f5" stroke-width="1.5"/>
    <text x="685" y="138" text-anchor="middle" fill="#2563eb" font-size="12.5" font-weight="700">PHASE 4</text>
    <text x="685" y="162" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">元进化</text>
    <text x="685" y="190" text-anchor="middle" fill="#64748b" font-size="12">飞轮越转越快</text>
    <text x="610" y="222" fill="#475569" font-size="12">周期：持续探索</text>
    <text x="610" y="248" fill="#475569" font-size="12">人工占比</text>
    <rect x="610" y="258" width="140" height="8" rx="4" fill="#eef1f5"/>
    <rect x="610" y="258" width="7" height="8" rx="4" fill="#3b82f6"/>
    <text x="755" y="267" text-anchor="end" fill="#2563eb" font-size="11.5" font-weight="700">5%</text>
    <text x="610" y="288" fill="#94a3b8" font-size="11.5">Auto-Research + 策略自优化</text>
  </g>

  <text x="430" y="350" text-anchor="middle" fill="#475569" font-size="13.5">先跑通 Phase 1：一个能手动转一圈的粗糙飞轮，好过一个精美但静止的蓝图</text>
</svg>
